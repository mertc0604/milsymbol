name: Deploy Military Symbol Studio

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build public site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test symbol rendering
        run: npx --no-install tead
        env:
          NODE_OPTIONS: '--import=data:text/javascript,globalThis.__version__=%22dev%22'

      - name: Build public site with license notices
        run: npm run studio:build:public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/studio-public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
