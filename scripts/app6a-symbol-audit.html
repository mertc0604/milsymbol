<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APP-6A · S-symbol image audit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20303d;font:14px/1.5 system-ui}header{padding:24px 32px;background:white;border-bottom:1px solid #d7dfe6}h1{font-size:24px;margin:0 0 8px}p{margin:6px 0;color:#596975}a{color:#2563a6}main{max-width:1450px;margin:auto;padding:24px}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}input,select,button{font:inherit;padding:9px 12px;border:1px solid #bec9d2;border-radius:4px;background:white}input{width:300px;max-width:100%}.card{background:white;border:1px solid #d7dfe6;border-radius:6px;margin-bottom:24px;padding:20px}h2{font-size:18px;margin:0}.meta{color:#627382;font-size:13px}.images{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.images figure{margin:0;text-align:center;background:#fafbfc;border:1px solid #e0e5eb;padding:12px}.images img{width:256px;max-width:100%;height:auto}.images figcaption{font-weight:600;margin-bottom:10px}.note{background:#f2f5f8;border-left:3px solid #7592ad;padding:12px;margin-top:12px}.conflict{border-left-color:#b04a35;background:#fff5ef}.legend{display:flex;gap:20px}.cyan{color:#0091c3}.pink{color:#d22d73}.source-cell{max-height:400px;max-width:100%}#pager{display:flex;gap:14px;align-items:center}.score{font-variant-numeric:tabular-nums}.missing{color:#a03b2c}details{margin-top:12px}summary{cursor:pointer}@media(max-width:800px){.images{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}.card{padding:12px}}
</style>
<header><h1>APP-6A · S-symbol image audit</h1><p>Publication / Before / Current / Difference — warfighting symbols only; G graphics excluded.</p><p id="summary">Loading…</p><a href="../../">Return to editor</a></header>
<main><p id="method" class="note"></p><p class="legend"><span class="cyan">Cyan: publication only</span><span class="pink">Magenta: current renderer only</span><span>Black: overlap</span></p>
<div class="toolbar"><input id="search" type="search" aria-label="Search S symbols" placeholder="Name, SIDC or hierarchy"><select id="affiliation" aria-label="Affiliation"><option value="F">Friend</option><option value="U">Unknown</option><option value="N">Neutral</option><option value="H">Hostile</option></select><select id="mode" aria-label="Frame mode"><option value="document">Publication default</option><option value="framed">Framed only</option><option value="unframed">Unframed only</option></select><select id="sort" aria-label="Sort comparisons"><option value="worst">Largest differences first</option><option value="best">Closest matches first</option><option value="source">Publication order</option><option value="missing">Missing source cells</option></select></div><div id="rows"></div><div id="pager"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></main>
<script type="module">
const data=await(await fetch('comparison.json')).json(),$=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('summary').textContent=`${data.rows.length} S symbols · ${data.rows.reduce((n,r)=>n+(r.cases||[]).filter(c=>c.comparison).length,0)} independent image pairs · no automatic conformance certification`;$('method').textContent=data.method;
$('search').value=new URLSearchParams(location.search).get('symbol')||'';
let page=0;
function render(){const term=$('search').value.toLowerCase(),order=$('sort').value,aff=$('affiliation').value,mode=$('mode').value;let rows=data.rows.filter(r=>(r.name+' '+r.id+' '+r.hierarchy).toLowerCase().includes(term)).map(r=>({r,c:(r.cases||[]).find(c=>c.affiliation===aff&&(mode==='document'||c.frame===(mode==='framed')))}));
if(mode!=='document')rows=rows.filter(({c})=>c);if(order==='missing')rows=rows.filter(({c})=>!c?.comparison);else if(order!=='source')rows.sort((a,b)=>(order==='worst'?1:-1)*((a.c?.comparison?.outlineSimilarity??-1)-(b.c?.comparison?.outlineSimilarity??-1)));
page=Math.max(0,Math.min(page,Math.ceil(rows.length/8)-1));
$('rows').innerHTML=rows.slice(page*8,page*8+8).map(({r,c})=>{
  const m=c?.comparison, conflict=c?.sourceConflict;
  return `<article class="card"><h2>${escape(r.name)}</h2>
    <div class="meta">${r.id} · ${r.hierarchy} · source frame prescription ${r.framePrescription||'unresolved'}</div>
    ${m?`<p class="score">Outline similarity ${(m.outlineSimilarity*100).toFixed(1)}% · color difference ${(m.colorMAE*100).toFixed(1)}% · printed p. ${c.printedPage??'unknown'} / PDF p. ${c.pdfPage} · ${c.frame?'framed':'unframed'} · current stroke ${m.strokeWidth}</p>
      <div class="images">${[['expected','Expected · publication'],['before','Before · preserved snapshot'],['actual','Current · milsymbol'],['difference','Difference overlay']].map(([suffix,label])=>`<figure><figcaption>${label}</figcaption><img loading="lazy" src="${c.key}-${suffix}.png" alt="${label}: ${escape(r.name)}"></figure>`).join('')}</div>
      <details><summary>Original source cell and actual SVG</summary><img class="source-cell" loading="lazy" src="${c.sourceImage}" alt="Unnormalized publication cell"><p>Source crop: ${c.crop.map(n=>n.toFixed(1)).join(', ')} pt · SIDC ${c.sidc} · baseline ${escape(c.baseline||'before.json')}</p><a href="${c.key}-${m.strokeWidth}.svg">Current SVG</a></details>`
      :`<p class="missing">${escape(r.extractionError||c?.error||'No reliable source image for this case.')}</p>`}
    <p class="note ${conflict?'conflict':''}">${escape(conflict ? 'Publication conflict — '+conflict+' Retained as source evidence; not counted as conformant.' : r.reviewNote||'Visual review required. The score helps locate differences; inspect the icon itself, frame, labels and colors. Matching outer frames alone do not establish conformance.')}</p></article>`;
}).join('');
$('page').textContent=`${rows.length} symbols · ${rows.length?page+1:0} / ${Math.ceil(rows.length/8)}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*8>=rows.length;
}
for(const id of ['search','affiliation','mode','sort'])$(id).oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();
</script></html>
